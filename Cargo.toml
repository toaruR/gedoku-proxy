[workspace]
resolver = "2"
members = [
    "src/gedoku-core",
    "src/gedoku-server",
    "src/gedoku-mock-upstream",
    "src/gedoku-jsonwalk",
    "src/gedoku-detect",
    "src/gedoku-mapstore",
    "src/gedoku-stream",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http1", "http2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11"
hex = "0.4"
anyhow = "1"
thiserror = "1"
async-stream = "0.3"
regex = "1"
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
zeroize = "1"
unicode-normalization = "0.1"
lru = "0.18"
crc32fast = "1"
